# Run on any PC/Pi on the SAME Wi‑Fi as YOUR Roku.
# Phone opens http://THIS-COMPUTER:8080/remote — finds YOUR TV only.
#
#   docker compose up -d --build
#   then open the URL printed in the logs

services:
  hisense-remote:
    build: .
    container_name: hisense-remote
    restart: unless-stopped
    network_mode: host
    environment:
      - DATA_DIR=/data
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - HTTP_PORT=8080
      - HTTPS_PORT=8443
    volumes:
      - ${DATA_DIR:-./data}:/data
